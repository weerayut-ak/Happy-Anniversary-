<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise! ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Prompt', sans-serif;
            background: linear-gradient(135deg, #ffe4e1 0%, #ffb6c1 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #5a3a41;
            overflow: hidden; 
        }

        .card {
            background-color: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.2);
            text-align: center;
            max-width: 400px;
            width: 90%;
            position: relative;
            z-index: 1; 
        }

        .photo-container img {
            width: 100%;
            height: auto;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            object-fit: cover;
        }

        h1 {
            color: #ff69b4;
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 24px;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        audio {
            width: 100%;
            outline: none;
            border-radius: 30px;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .btn {
            font-family: 'Prompt', sans-serif;
            font-size: 18px;
            padding: 10px 30px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        .btn-yes {
            background-color: #ff69b4;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.4);
        }

        .btn-no {
            background-color: #e0e0e0;
            color: #555;
            z-index: 9999; 
            position: relative; 
        }

        #surprise-section {
            display: none; 
        }
    </style>
</head>
<body>

    <div class="card">
        
        <div id="question-section">
            <h1>รักเค้าไหม? 🥺</h1>
            <p>ตอบมาตามความจริงเลยนะ!</p>
            <div class="btn-group">
                <button id="btn-yes" class="btn btn-yes">รักสิ! ❤️</button>
                <button id="btn-no" class="btn btn-no">ไม่รัก 💔</button>
            </div>
        </div>

        <div id="surprise-section">
            <div class="photo-container">
                <img src="zxc.jpg" alt="Our Memory">
            </div>
            <h1>Happy Anniversary! 💖</h1>
            <p>ขอบคุณสำหรับทุกช่วงเวลาดีๆ ที่มีให้กันนะ</p>
            
            <audio id="bg-music" controls>
                <source src="your-song.mp3" type="audio/mpeg">
                เบราว์เซอร์ของคุณไม่รองรับการเล่นเพลง
            </audio>
        </div>

    </div>

    <script>
        const btnNo = document.getElementById('btn-no');
        const btnYes = document.getElementById('btn-yes');
        const questionSection = document.getElementById('question-section');
        const surpriseSection = document.getElementById('surprise-section');
        const bgMusic = document.getElementById('bg-music');

        function moveButton() {
            if (btnNo.parentNode !== document.body) {
                document.body.appendChild(btnNo);
            }

            const maxX = window.innerWidth - btnNo.offsetWidth;
            const maxY = window.innerHeight - btnNo.offsetHeight;
            
            const x = Math.max(10, Math.random() * (maxX - 20));
            const y = Math.max(10, Math.random() * (maxY - 20));
            
            btnNo.style.position = 'fixed';
            btnNo.style.left = `${x}px`;
            btnNo.style.top = `${y}px`;
        }

        btnNo.addEventListener('mouseover', moveButton);
        
        btnNo.addEventListener('touchstart', (e) => {
            e.preventDefault(); 
            moveButton();
        });

        // 🌟 ฟังก์ชันสำหรับยิงพลุ 🌟
        function shootFireworks() {
            var duration = 3 * 1000; // ตั้งเวลาพลุจุด 3 วินาที
            var end = Date.now() + duration;

            (function frame() {
                // พลุยิงจากฝั่งซ้าย
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0, y: 0.8 },
                    colors: ['#ff69b4', '#ff1493', '#ffb6c1', '#ffffff'] // โทนสีชมพู ขาว
                });
                // พลุยิงจากฝั่งขวา
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1, y: 0.8 },
                    colors: ['#ff69b4', '#ff1493', '#ffb6c1', '#ffffff'] // โทนสีชมพู ขาว
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }

        btnYes.addEventListener('click', () => {
            questionSection.style.display = 'none';
            btnNo.style.display = 'none';
            surpriseSection.style.display = 'block';
            bgMusic.play();

            // 🌟 เรียกใช้ฟังก์ชันยิงพลุเมื่อกดปุ่มรัก 🌟
            shootFireworks();
        });
    </script>

</body>
</html>
