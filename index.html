<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise! ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        /* ตั้งค่าพื้นฐานและพื้นหลัง */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
            background: linear-gradient(135deg, #ffe4e1 0%, #ffb6c1 100%); /* ไล่สีชมพูพาสเทล */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #5a3a41;
        }

        /* การออกแบบกล่องการ์ด (Card) แบบโมเดิร์น */
        .card {
            background-color: rgba(255, 255, 255, 0.85); /* สีขาวโปร่งแสงนิดๆ */
            backdrop-filter: blur(10px); /* เอฟเฟกต์เบลอพื้นหลัง */
            padding: 40px;
            border-radius: 24px; /* ขอบโค้งมน */
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.2); /* เงาสีชมพูอ่อนๆ */
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        /* การจัดการรูปภาพ */
        .photo-container img {
            width: 100%;
            height: auto;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            object-fit: cover;
        }

        /* การตกแต่งข้อความ */
        h1 {
            color: #ff69b4; /* สีชมพูเข้ม */
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 24px;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        /* ตกแต่งเครื่องเล่นเพลง */
        audio {
            width: 100%;
            outline: none;
            border-radius: 30px;
        }
        
        /* ปรับแต่งสีของเครื่องเล่นเพลง (เฉพาะบางเบราว์เซอร์) */
        audio::-webkit-media-controls-panel {
            background-color: #ffe1e8;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="photo-container">
            <img src="your-photo.jpg" alt="Our Memory">
        </div>

        <h1>Happy Anniversary! 💖</h1>
        <p>ขอบคุณสำหรับทุกช่วงเวลาดีๆ ที่มีให้กันนะ<br>ลองกดฟังเพลงด้านล่างดูสิ</p>

        <audio controls autoplay>
            <source src="your-song.mp3" type="audio/mpeg">
            เบราว์เซอร์ของคุณไม่รองรับการเล่นเพลง
        </audio>
    </div>

</body>
</html>
